[package]
name = "a6i"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-runtime = "1"
aws-sdk-lambda = "1.151.0"
aws-sdk-sfn = "1.120.0"
aws-sdk-sts = "1"
aws-sdk-route53 = "1"
aws-sdk-apigateway = "1"
aws-sdk-apigatewayv2 = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-sns = "1"
aws-sdk-sqs = "1"
aws-sdk-eventbridge = "1"
aws-types = "1"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
