name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Check release tag
        id: version
        run: |
          bash tests/release_tag.sh --self-test
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "a6i") | .version')
          tag=$(bash tests/release_tag.sh "$version" "$GITHUB_RUN_NUMBER")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check and build
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          target/release/a6i --help
      - name: Prepare assets
        run: |
          mkdir -p dist
          cp target/release/a6i dist/a6i-linux-x86_64
          (cd dist && sha256sum a6i-linux-x86_64 > a6i-linux-x86_64.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify assets
        run: |
          (cd dist && sha256sum -c a6i-linux-x86_64.sha256)
          test -s dist/a6i-linux-x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            test "$tagged_sha" = "$GITHUB_SHA" || { echo "Tag $TAG points to another commit" >&2; exit 1; }
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            grep -Fxq a6i-linux-x86_64 <<< "$assets"
            grep -Fxq a6i-linux-x86_64.sha256 <<< "$assets"
            echo "Release $TAG already published"
          else
            if ! gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null; then
              tagged_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
              test "$tagged_sha" = "$GITHUB_SHA" || { echo "Tag $TAG points to another commit" >&2; exit 1; }
            fi
            gh release create "$TAG" dist/a6i-linux-x86_64 dist/a6i-linux-x86_64.sha256 --verify-tag --generate-notes
          fi
